server:
  applicationConnectors:
    - type: http
      port: 8080
  adminConnectors:
    - type: http
      port: 8081

logging:
  level: INFO
  loggers:
    com.twilio.task.manager: DEBUG

database:
  driverClass: org.postgresql.Driver
  url: ${DB_URL:-jdbc:postgresql://ep-old-bread-aqf54pir.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require}
  user: ${DB_USER:-neondb_owner}
  password: ${DB_PASSWORD:-npg_B7TkEtjoS2pY}
  maxWaitForConnection: 1s
  validationQuery: "SELECT 1"
  validationQueryTimeout: 3s
  initialSize: 2
  minSize: 2
  maxSize: 8
  checkConnectionWhileIdle: true
  evictionInterval: 10s
  minIdleTime: 1 minute

datadog:
  apiKey: ${DD_API_KEY:-}
  site: datadoghq.com
  prefix: task-manager
  tags:
    - env:dev
    - service:task-manager

kafka:
  # Comma-separated list of broker host:port pairs.
  # Override with KAFKA_BOOTSTRAP_SERVERS for a remote cluster.
  bootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
  tasksTopic: tasks
  usersTopic: users
  projectsTopic: projects
  consumerGroupId: task-manager-group
  consumerTopics:
    - tasks
    - users
    - projects
  # Set to SASL_SSL for remote clusters (e.g. Confluent Cloud, MSK).
  securityProtocol: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
  # Required when securityProtocol is SASL_SSL (e.g. PLAIN, SCRAM-SHA-256).
  saslMechanism: ${KAFKA_SASL_MECHANISM:-}
  # Full JAAS config string — set via env var, never hard-code credentials.
  saslJaasConfig: ${KAFKA_SASL_JAAS_CONFIG:-}
